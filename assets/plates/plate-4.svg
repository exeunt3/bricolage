  <g fill="#1f1d1b" font-family="serif" font-size="12">
    <text x="136" y="122">This inset persists as recursive gloss,</text>
    <text x="136" y="140">citation folded against chronology,</text>
    <text x="136" y="158">pressure retaining unfinished sequence.</text>
    <text x="406" y="244">Index remnants, marginal torque,</text>
